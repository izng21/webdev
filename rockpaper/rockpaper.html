<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="rockpaperstyle.css">
</head>
<body>
  <a href="../index.html" class="back-button">⬅️ Back to Homepage</a>
  <h1>✊✋✌️ Rock Paper Scissors</h1>

  <div class="game-container">
    <div id="choices">
      <button onclick="play('rock')">✊ Rock</button>
      <button onclick="play('paper')">✋ Paper</button>
      <button onclick="play('scissors')">✌️ Scissors</button>
    </div>
    
    <div id="result">
      <p>You chose: <span id="user-choice">-</span></p>
      <p>Computer chose: <span id="computer-choice">-</span></p>
      <h2 id="outcome">Result: -</h2>
    </div>

    <div id="scoreboard">
      <p>Your Score: <span id="user-score">0</span></p>
      <p>Computer Score: <span id="comp-score">0</span></p>
    </div>
  </div>

  <script src="rockpaper.js"></script>
</body>
</html>
